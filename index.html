<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operation Low-Poly</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hud-shell">
      <header>
        <h1>Operation Low-Poly</h1>
        <p>第二次世界大戦モチーフ / PS1風TPSプロトタイプ</p>
      </header>
      <section class="hud">
        <span id="hp">HP: 100</span>
        <span id="ammo">Ammo: 30</span>
        <span id="score">Score: 0</span>
        <span id="wave">Wave: 1</span>
      </section>
      <canvas id="battlefield" width="960" height="540" aria-label="ゲーム画面"></canvas>
      <section class="controls">
        <p>移動: WASD / 方向転換: ←→ / 射撃: Space</p>
        <p>敵を倒して波状攻撃をしのげ！</p>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
